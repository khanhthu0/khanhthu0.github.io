name: Deploy thiệp cưới lên GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Cho phép workflow bật/tắt Pages và deploy
permissions:
  contents: read
  pages: write
  id-token: write

# Cho phép chạy tuần tự, hủy job cũ khi có commit mới
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
